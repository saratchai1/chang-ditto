name: Unpack application assets

on:
  push:
    branches:
      - feat/field-service-mvp
    paths:
      - _payload/ready

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Decode and verify application files
        shell: bash
        run: |
          cat _payload/chang-assets.part* | base64 --decode > /tmp/chang-assets.tgz
          echo "83d1ad166cb9e263abea8c7d853b151e9e2e8c6b0b527fbac06b55fe385d0f17  /tmp/chang-assets.tgz" | sha256sum -c -
          tar -xzf /tmp/chang-assets.tgz
          rm -rf _payload
          rm -f .github/workflows/unpack-assets.yml

      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add field service application assets"
          git push
